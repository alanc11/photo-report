<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reporte Fotográfico</title>

  <!-- Tipografías Plus Jakarta Sans e Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style/styles.css">
</head>
<body>

  <main class="app-wrapper">
    <article class="card">
      
      <!-- Cabecera -->
      <header class="card-header">
        <div class="header-text">
          <h2>Reporte Fotográfico</h2>
          <p>Servicio Técnico</p>
        </div>
        <span class="badge">ZEISS FSE</span>
      </header>

      <form id="form">
        <!-- FSE -->
        <div class="form-group">
          <label for="fse">Ingeniero FSE</label>
          <input type="text" id="fse" name="fse" placeholder="Nombre completo" required autocomplete="name">
        </div>

        <!-- Fila de 2 columnas: Equipo y Serie -->
        <div class="form-row">
          <div class="form-group">
            <label for="equipment">Equipo</label>
            <input list="equipment-list" type="text" id="equipment" name="equipment" placeholder="Modelo" required>
            <datalist id="equipment-list">
              <option value="Cirrus HD-OCT">
              <option value="Clarus 700">
              <option value="IOLMaster 500">
              <option value="IOLMaster 700">
              <option value="LUMERA 700">
              <option value="HFA 3">
              <option value="LUMERA 700">
              <option value="VISUCAM 524">
              <option value="VISULAS green">
              <option value="VISULAS green">
              <option value="VISULAS YAG">
              <option value="VISULAS 532">
            </datalist>
          </div>

          <div class="form-group">
            <label for="sn">Número de serie</label>
            <input type="text" id="sn" name="serial_number" placeholder="SN-XXXXX" required>
          </div>
        </div>

        <!-- Fecha -->
        <div class="form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date" name="date" required>
        </div>

        <!-- Comentarios -->
        <div class="form-group">
          <label for="text">Comentarios / Observaciones</label>
          <textarea id="text" name="comment" rows="3" placeholder="Alineación óptica verificada y calibración completada con éxito."></textarea>
        </div>

        <!-- Dropzone de fotos -->
        <div class="form-group">
          <label>Evidencia Fotográfica</label>
          
          <input 
            type="file" 
            id="photos" 
            name="photos" 
            multiple 
            accept="image/jpeg, image/png, image/webp" 
            class="visually-hidden"
          >

          <label for="photos" class="dropzone" id="dropzone">
            <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            <span class="dropzone-title">SELECCIONAR O TOMAR FOTOS</span>
            <span class="dropzone-subtitle">JPEG, PNG O WEBP (HASTA 10 IMÁGENES)</span>
          </label>

          <!-- Galería de previsualización -->
          <output id="preview-output"></output>
        </div>

        <!-- Botón principal -->
        <button type="button" class="btn-primary" id="btn-pdf" onclick="genPDF(event)">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
          </svg>
          Generar Reporte PDF
        </button>

      </form>
    </article>
  </main>

  <!-- jsPDF moderna y script principal -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./scripts/main.js"></script>
</body>
</html>
